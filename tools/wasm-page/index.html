<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest REPL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Quest</h1>
  <span id="status">Loading the driver…</span>
  <span class="actions">
    <button id="interrupt" type="button" disabled title="Ctrl-C">Interrupt</button>
    <button id="restart" type="button" disabled>Restart</button>
  </span>
</header>
<main id="transcript" aria-live="polite"></main>
<form id="line" autocomplete="off">
  <label for="input" id="prompt">&gt;&gt;</label>
  <input id="input" spellcheck="false" autocapitalize="off" disabled>
</form>
<footer id="support">Runs in Chrome and other Chromium browsers, Firefox, and Safari, recent versions (tested:
Chrome 157, Firefox 160, Safari 26.6), which have WebAssembly's garbage collection, tail calls, and
exceptions.</footer>
<script type="module" src="ui.mjs"></script>
</body>
</html>
